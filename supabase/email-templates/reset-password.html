<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Your Password — Life RPG OS</title>
</head>
<body style="margin: 0; padding: 0; background-color: #F6F4EE; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #2B2823;">
  <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #F6F4EE; padding: 32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width: 540px; background-color: #FFFFFF; border-radius: 20px; border: 1px solid #E6E2D8; box-shadow: 0 8px 30px rgba(43, 40, 35, 0.06); overflow: hidden;">
          <tr>
            <td style="padding: 36px 36px 20px; text-align: center; background-color: #FAF8F5; border-bottom: 1px solid #EFECE6;">
              <h1 style="margin: 0; font-size: 22px; font-weight: 800; color: #2B2823;">Life RPG OS</h1>
              <p style="margin: 4px 0 0; font-size: 13px; color: #787368;">Password Reset Request</p>
            </td>
          </tr>
          <tr>
            <td style="padding: 36px;">
              <h2 style="margin: 0 0 14px; font-size: 19px; font-weight: 700; color: #2B2823;">Reset your adventurer passcode</h2>
              <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.6; color: #5C574E;">
                Click the button below to reset your account password. If you didn't request a password reset, you can safely ignore this email.
              </p>
              <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="margin: 28px 0 20px;">
                <tr>
                  <td align="center">
                    <a href="{{ .ConfirmationURL }}" target="_blank" style="display: inline-block; padding: 15px 38px; background-color: #5B57F0; color: #FFFFFF; font-size: 15px; font-weight: 700; text-decoration: none; border-radius: 999px; box-shadow: 0 6px 20px rgba(91, 87, 240, 0.35);">
                      Reset Password &rarr;
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin: 20px 0 0; font-size: 12px; color: #8A857A; word-break: break-all; border-top: 1px solid #EFECE6; padding-top: 16px;">
                Direct Link: <a href="{{ .ConfirmationURL }}" style="color: #5B57F0;">{{ .ConfirmationURL }}</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
